<!DOCTYPE html>
<html lang="zh-CN" data-filter="amber" data-mode="art">
<head>
  <link rel="icon" href="favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>博客 — 李程浩 LoanCold</title>
  <meta name="description" content="李程浩（LoanCold）的博客集合：诗、感想与杂记。">
  <script>
    try {
      var q = new URLSearchParams(location.search).get('mode');
      var h = location.hash.replace('#', '');
      var saved = sessionStorage.getItem('loancold.mode.session') || localStorage.getItem('loancold.mode');
      var m = (q === 'art' || h === 'art') ? 'art'
            : (q === 'pro' || h === 'pro') ? 'pro'
            : (saved === 'pro' ? 'pro' : 'art');
      document.documentElement.setAttribute('data-mode', m);
    } catch (e) { document.documentElement.setAttribute('data-mode', 'art'); }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <script src="assets/js/fallback.js" defer></script>
  <script type="importmap">
  {
    "imports": {
      "three": "./assets/vendor/three.module.min.js"
    }
  }
  </script>
</head>
<body>

  <main class="page-main">
    <header class="page-head reveal">
      <span class="kicker" data-i18n="blog.kicker">BLOG / NOTES</span>
      <h1 data-i18n="blog.title">博客集合</h1>
    </header>

    <!-- 3D 挂载点：体素波浪（保留全站 3D 嵌入能力，失败自动隐藏） -->
    <div id="blog-dither" class="blog-mount" aria-hidden="true">
      <div class="dither-loading mono">LOADING_1BIT</div>
    </div>

    <!-- Notion 入口 -->
    <a class="notion-card reveal"
       href="https://longhaired-pen-27c.notion.site/Literature-Thoughts-and-Hobby-ff2eb9d141784a2ba661bac441ed22d7"
       target="_blank" rel="noopener">
      <span class="notion-title" data-i18n="blog.notion.title">最新写作 · 已迁移至 Notion</span>
      <span class="notion-desc" data-i18n="blog.notion.desc">我的最新博客已迁移到 Notion，点击前往阅读。下方为 2018–2021 年的历史存档。</span>
      <span class="notion-cta mono" data-i18n="blog.notion.cta">前往 Notion →</span>
    </a>

    <!-- 历史存档 -->
    <h2 class="section-title archive-title" data-i18n="blog.archive">历史存档</h2>

    <!-- 分类筛选 -->
    <div id="chip-row" class="chip-row" role="group" aria-label="分类筛选"></div>

    <!-- 文章列表（数据驱动） -->
    <section id="post-list" aria-label="文章列表">
      <p class="dim mono">POSTS_LOADING…</p>
    </section>
  </main>

  <script type="module" src="assets/js/layout.js"></script>
  <script type="module" src="assets/js/blog.js"></script>
</body>
</html>
