<!DOCTYPE html>
<html lang="zh-CN" data-filter="amber" data-mode="pro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品 — 李程浩 LoanCold</title>
  <meta name="description" content="李程浩的个人作品：操作系统、FPGA 计算机系统、Rust 生态研究、数学建模与校园信息平台等项目。">
  <link rel="icon" href="favicon.svg">
  <script>
    try {
      var q = new URLSearchParams(location.search).get('mode');
      var h = location.hash.replace('#', '');
      var saved = sessionStorage.getItem('loancold.mode.session') || localStorage.getItem('loancold.mode');
      var m = (q === 'art' || h === 'art') ? 'art'
            : (q === 'pro' || h === 'pro') ? 'pro'
            : (saved === 'pro' ? 'pro' : 'art');
      document.documentElement.setAttribute('data-mode', m);
    } catch (e) { document.documentElement.setAttribute('data-mode', 'art'); }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <script src="assets/js/fallback.js" defer></script>
</head>
<body>

  <main class="page-main">
    <header class="page-head reveal">
      <span class="kicker" data-i18n="works.kicker">SELECTED WORKS</span>
      <h1 data-i18n="works.title">个人作品</h1>
    </header>

    <!-- 作品卡片由 data/projects.json 驱动渲染（assets/js/works.js） -->
    <div class="work-grid" id="work-grid">
      <p class="dim mono">LOADING…</p>
    </div>
  </main>

  <script type="module" src="assets/js/layout.js"></script>
  <script type="module" src="assets/js/works.js"></script>
</body>
</html>
